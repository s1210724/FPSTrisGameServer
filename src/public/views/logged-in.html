<!DOCTYPE html>
<html>
<head>
    <title>FPSTris Overzicht</title>
</head>
<body>
    <main>
        <h1 id="welcomeHeader">Welkom bij FPSTris</h1>

        <div id="userInfo">
            <p>Gebruikers-ID: <span id="userId">-</span></p>
            <p>Gebruikersnaam: <span id="username">-</span></p>
            <p>Toegangsrechten: <span id="claims">-</span></p>
        </div>

        <nav>
            <ul>
                <li><a href="/">Start</a></li>
                <li><a href="/lobby">Deelnemen aan Lobby</a></li>
                <li id="adminLink" style="display: none;">
                    <a href="/admin">Beheerpaneel</a>
                </li>
                <li><a href="/" onclick="logout()">Uitloggen</a></li>
            </ul>
        </nav>

        <section id="content">
            <h2>Overzicht</h2>
            <p>U bent ingelogd. Gebruik de navigatie hierboven om functies te openen.</p>
        </section>
    </main>

    <script>
        function logout() {
            // Wis cookie door het logout-endpoint aan te roepen
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    window.location.href = '/';
                })
                .catch(() => {
                    window.location.href = '/';
                });
        }

        // Haal de gebruikerinfo op om de pagina te vullen en de admin-link te tonen
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/user', {
                    method: 'GET',
                    credentials: 'include',
                });

                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }

                const user = await response.json();
                document.getElementById('userId').textContent = user.userId || '-';
                document.getElementById('username').textContent = user.username || '-';
                document.getElementById('claims').textContent = (user.claims || []).join(', ') || 'geen';
                document.getElementById('welcomeHeader').textContent = `Welkom, ${user.username}!`;

                // Toon admin-link als gebruiker admin-rechten heeft
                if (Array.isArray(user.claims) && user.claims.includes('admin')) {
                    document.getElementById('adminLink').style.display = 'list-item';
                }
            } catch (error) {
                console.error('Kon gebruikersinformatie niet laden:', error);
                window.location.href = '/login';
            }
        }

        loadUserInfo();
    </script>
</body>
</html>
