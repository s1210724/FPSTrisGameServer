<!DOCTYPE html>
<html>
<head>
    <title>FPSTris Dashboard</title>
</head>
<body>
    <main>
        <h1 id="welcomeHeader">Welcome to FPSTris</h1>

        <div id="userInfo">
            <p>User ID: <span id="userId">-</span></p>
            <p>Username: <span id="username">-</span></p>
            <p>Claims: <span id="claims">-</span></p>
        </div>

        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/lobby">Join Lobby</a></li>
                <li id="adminLink" style="display: none;">
                    <a href="/admin">Admin Panel</a>
                </li>
                <li><a href="/" onclick="logout()">Logout</a></li>
            </ul>
        </nav>

        <section id="content">
            <h2>Dashboard</h2>
            <p>You are logged in. Use the navigation above to access features.</p>
        </section>
    </main>

    <script>
        function logout() {
            // Clear cookie by fetching logout endpoint
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    window.location.href = '/';
                })
                .catch(() => {
                    window.location.href = '/';
                });
        }

        // Fetch the current user info to populate the page and show admin link if applicable
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/user', {
                    method: 'GET',
                    credentials: 'include',
                });

                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }

                const user = await response.json();
                document.getElementById('userId').textContent = user.userId || '-';
                document.getElementById('username').textContent = user.username || '-';
                document.getElementById('claims').textContent = (user.claims || []).join(', ') || 'none';
                document.getElementById('welcomeHeader').textContent = `Welcome, ${user.username}!`;

                // Show admin link if user has admin claim
                if (Array.isArray(user.claims) && user.claims.includes('admin')) {
                    document.getElementById('adminLink').style.display = 'list-item';
                }
            } catch (error) {
                console.error('Failed to load user info:', error);
                window.location.href = '/login';
            }
        }

        loadUserInfo();
    </script>
</body>
</html>
