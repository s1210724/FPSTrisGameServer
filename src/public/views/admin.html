<!DOCTYPE html>
<html>
<head>
    <title>FPSTris Beheerpaneel</title>
</head>
<body>
    <main>
        <h1>Beheerpaneel</h1>

        <nav>
            <ul>
                <li><a href="/">Start</a></li>
                <li><a href="/logged-in">Overzicht</a></li>
                <li><a href="/" onclick="logout()">Uitloggen</a></li>
            </ul>
        </nav>

        <section id="adminContent">
            <h2>Beheer</h2>
            <p>Welkom, beheerder. U heeft toegang tot gevoelige handelingen.</p>

            <h3>Systeemstatus</h3>
            <div id="systemStatus">
                <p>Systeemgegevens worden geladen...</p>
            </div>

            <h3>Gebruikersbeheer</h3>
            <p>Functies voor gebruikersbeheer komen hier.</p>

            <h3>Instellingen</h3>
            <p>Geavanceerde applicatie-instellingen komen hier.</p>
        </section>
    </main>

    <script>
        function logout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    window.location.href = '/';
                })
                .catch(() => {
                    window.location.href = '/';
                });
        }

        async function loadAdminInfo() {
            try {
                const response = await fetch('/api/auth/user', {
                    method: 'GET',
                    credentials: 'include',
                });

                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }

                const user = await response.json();

                // Controleer admin-recht
                if (!Array.isArray(user.claims) || !user.claims.includes('admin')) {
                    window.location.href = '/logged-in';
                    return;
                }

                // Laad basis systeeminformatie
                document.getElementById('systemStatus').innerHTML = `
                    <p><strong>Huidige gebruiker:</strong> ${user.username}</p>
                    <p><strong>Gebruikers-ID:</strong> ${user.userId}</p>
                    <p><strong>Toegangsrechten:</strong> ${user.claims.join(', ')}</p>
                `;
            } catch (error) {
                console.error('Kon admin-info niet laden:', error);
                window.location.href = '/login';
            }
        }

        loadAdminInfo();
    </script>
</body>
</html>
