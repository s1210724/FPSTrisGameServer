<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <title>FPSTris Registreren</title>
</head>
<body class="auth-body">

    <%- include("partials/header.html", { username }) %>

    <main class="main-auth-container">
        <div class="auth-container">
            <div class="auth-tag">
            REGISTRATIE_TERMINAL
            </div>

            <h1 class="auth-title">
                AANMAKEN
                <span>ACCOUNT</span>
            </h1>

            <div id="registerStatus" class="auth-status"></div>

            <!-- FORMULIER -->
            <form id="registerForm" class="auth-form">

                <!-- GEBRUIKERSNAAM -->
                <div class="auth-field">

                    <label for="username">
                        Gebruikersnaam
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        maxlength="64"
                        required
                    >

                </div>

                <!-- E-MAIL -->
                <div class="auth-field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        maxlength="256"
                        required
                    >

                </div>

                <!-- WACHTWOORD -->
                <div class="auth-field">

                    <label for="password">
                        Wachtwoord
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        maxlength="256"
                        required
                    >

                </div>

                <!-- VERZENDEN -->
                <button
                    id="registerButton"
                    class="auth-button"
                    type="submit"
                >
                    Registreren
                </button>

            </form>

            <!-- LINKS -->
            <div class="auth-links">

                <a href="/login">
                    Heeft u al een account?
                </a>

                <a href="/">
                    Terug
                </a>

            </div>
        </div>

        

    </main>

    <%- include("partials/footer.html") %>

    <script src="/js/register.js"></script>

</body>
</html>
