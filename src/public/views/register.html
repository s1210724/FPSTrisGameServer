<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <title>FPSTris Login</title>
</head>
<body class="auth-body">

    <%- include("partials/header.html", { username }) %>

    <main class="main-auth-container">
        <div class="auth-container">
            <div class="auth-tag">
            REGISTRATION_TERMINAL
            </div>

            <h1 class="auth-title">
                CREATE
                <span>ACCOUNT</span>
            </h1>

            <div id="registerStatus" class="auth-status"></div>

            <!-- FORM -->
            <form id="registerForm" class="auth-form">

                <!-- USERNAME -->
                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        maxlength="64"
                        required
                    >

                </div>

                <!-- EMAIL -->
                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        maxlength="256"
                        required
                    >

                </div>

                <!-- PASSWORD -->
                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        maxlength="256"
                        required
                    >

                </div>

                <!-- SUBMIT -->
                <button
                    id="registerButton"
                    class="auth-button"
                    type="submit"
                >
                    Register
                </button>

            </form>

            <!-- LINKS -->
            <div class="auth-links">

                <a href="/login">
                    Already have an account?
                </a>

                <a href="/">
                    Back
                </a>

            </div>
        </div>

        

    </main>

    <%- include("partials/footer.html") %>

    <script src="/js/register.js"></script>

</body>
</html>
