<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <title>FPSTris Inloggen</title>
</head>
<body class="auth-body">

    <%- include("partials/header.html", { username }) %>

    <main class="main-auth-container">
        <div class="auth-container">
            <div class="auth-tag">INLOG_TERMINAL</div>

            <h1 class="auth-title">
                INLOGGEN
                <span>TOEGANG</span>
            </h1>

            <p id="loginStatus" class="auth-description">
                Voer uw gegevens in om toegang te krijgen tot het systeem.
            </p>

            <form id="loginForm" class="auth-form">

                <div class="auth-field">
                    <label for="username">Gebruikersnaam</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Wachtwoord</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button id="loginButton" class="auth-button" type="submit">
                    Inloggen
                </button>

            </form>

            <div class="auth-links">
                <a href="/register">Account aanmaken</a>
                <a href="/">Terug</a>
            </div>
        </div>

        

    </main>

    <%- include("partials/footer.html") %>

    <script src="/js/login.js"></script>

</body>
</html>
